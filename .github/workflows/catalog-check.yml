name: Weekly Catalog Source Check

# Runs every Monday at 14:00 UTC. Adjust the cron schedule below if you want a different day/time
# — https://crontab.guru is a good way to double-check any cron expression before changing it.
# workflow_dispatch lets you also trigger this manually from GitHub's Actions tab, which is worth
# doing once right after setting this up, rather than waiting a full week to see if it works.
on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  check-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run catalog source check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python check_catalog_sources.py

      - name: Commit updated hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add page-hashes.json
          git diff --staged --quiet || git commit -m "Update catalog source hashes [automated]"
          git push
